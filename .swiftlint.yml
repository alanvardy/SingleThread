# Paths to include/exclude
included:
  - SingleThread
  - SingleThreadCore
  - SingleThreadWatch
  - SingleThreadWidget
  - SingleThreadTests
  - SingleThreadUITests
  - SingleThreadWatchUITests

# XCTest-specific rules disabled — project uses Swift Testing
disabled_rules:
  - single_test_class
  - balanced_xctest_lifecycle
  - empty_xctest_method
  - final_test_case
  - multiple_closures_with_trailing_closure
  - type_name

# Rule thresholds
line_length:
  warning: 120
  error: 150

cyclomatic_complexity:
  warning: 12
  error: 15

type_body_length:
  warning: 500
  error: 600

file_length:
  warning: 700
  error: 800

# Allow force-casting in test code
force_cast:
  severity: warning
force_try:
  severity: warning

# Opt-in rules appropriate for this project
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - attributes
  - closure_spacing
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - function_default_parameter_at_end
  - implicit_return
  - legacy_multiple
  - legacy_objc_type
  - overridden_super_call
  - prefer_self_in_static_references
  - prohibited_super_call
  - redundant_type_annotation
  - self_binding
  - shorthand_optional_binding
  - sorted_imports
  - static_over_final_class
  - toggle_bool
  - trailing_closure
  - unhandled_throwing_task
  - unneeded_synthesized_initializer
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

# Test files have different standards
identifier_name:
  excluded:
    - id
    - e
    - d
    - rt
    - to
    - gvm
