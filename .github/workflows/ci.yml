name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadTests \
            -showBuildTimingSummary

      - name: Unit tests
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building \
            -only-testing:SingleThreadTests \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult

  ui-tests:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadUITests \
            -showBuildTimingSummary

      - name: UI tests
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building \
            -only-testing:SingleThreadUITests

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Install mise
        run: brew install mise

      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-tools-${{ runner.os }}-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-${{ runner.os }}-

      - name: Install tools
        run: mise install

      - name: Put mise shims on PATH
        run: echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: SwiftFormat check
        timeout-minutes: 5
        run: swiftformat --lint SingleThread/ SingleThreadCore/ SingleThreadWatch/ SingleThreadTests/ SingleThreadUITests/

      - name: SwiftLint
        timeout-minutes: 5
        run: swiftlint lint --strict

      - name: Watch build
        timeout-minutes: 15
        run: |
          xcodebuild -scheme SingleThreadWatch \
            -destination "generic/platform=watchOS Simulator" \
            -configuration Debug \
            build \
            -showBuildTimingSummary

      - name: Periphery
        timeout-minutes: 10
        run: periphery scan --strict -- -destination "platform=iOS Simulator,name=iPhone 17"
