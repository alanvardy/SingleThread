name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the iOS UI class groups. Each job reads exactly one
# `-only-testing:` fragment; the groups are disjoint and cover all 5 iOS UI classes
# in the SingleThreadUITests target exactly once.
env:
  UI_GROUP_A_ONLY_TESTING: "-only-testing:SingleThreadUITests/SingleThreadUITestsLaunchTests -only-testing:SingleThreadUITests/SingleThreadUITestsAppearanceLaunchTests"
  UI_GROUP_B_ONLY_TESTING: "-only-testing:SingleThreadUITests/SingleThreadUITestsFlows"
  UI_GROUP_C_ONLY_TESTING: "-only-testing:SingleThreadUITests/SingleThreadUITests -only-testing:SingleThreadUITests/ActionButtonsUITests"

jobs:
  unit-tests:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThreadWatchUITests/**', 'SingleThreadWidget/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadTests \
            -showBuildTimingSummary

      - name: Unit tests
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building \
            -only-testing:SingleThreadTests \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult

  ui-tests-flows:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThreadWatchUITests/**', 'SingleThreadWidget/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadUITests \
            -showBuildTimingSummary

      - name: UI tests (flows)
        timeout-minutes: 45
        run: |
          # Disables parallel test simulator clones: on GitHub's virtualized macOS
          # runners the iOS clone connection to com.apple.instruments.deviceservice.lockdown
          # can time out (120s) and stall the whole step. A single concurrent
          # destination avoids that race.
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            -maximum-test-execution-time-allowance 900 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            test-without-building \
            ${{ env.UI_GROUP_B_ONLY_TESTING }}

  ui-tests-launch-appearance:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThreadWatchUITests/**', 'SingleThreadWidget/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadUITests \
            -showBuildTimingSummary

      - name: UI tests (launch + appearance)
        timeout-minutes: 45
        run: |
          # Disable parallel test simulator clones (see the main ui-tests
          # comment); a single concurrent destination per job avoids the race.
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            -maximum-test-execution-time-allowance 900 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            test-without-building \
            ${{ env.UI_GROUP_A_ONLY_TESTING }}

  ui-tests-audits:
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    env:
      SIM: platform=iOS Simulator,name=${{ matrix.device }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadUITests/**', 'SingleThreadCore/**', 'SingleThreadWatch/**', 'SingleThreadWatchUITests/**', 'SingleThreadWidget/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Pre-boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -F "${{ matrix.device }} (" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadUITests \
            -showBuildTimingSummary

      - name: UI tests (audits + action buttons)
        timeout-minutes: 45
        run: |
          # Disables parallel test simulator clones: on GitHub's virtualized macOS
          # runners the iOS clone connection to com.apple.instruments.deviceservice.lockdown
          # can time out (120s) and stall the whole step. A single concurrent
          # destination avoids that race.
          xcodebuild -scheme SingleThread \
            -destination "$SIM" \
            -derivedDataPath "$DERIVED_DATA" \
            -maximum-test-execution-time-allowance 900 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            test-without-building \
            ${{ env.UI_GROUP_C_ONLY_TESTING }}

  mac-tests:
    runs-on: macos-26
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: derived-data-mac-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThread/**', 'SingleThreadTests/**', 'SingleThreadCore/**', 'SingleThreadWidget/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-mac-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-
            derived-data-mac-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build (macOS)
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "platform=macOS" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            -showBuildTimingSummary

      - name: Unit tests (macOS)
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThread \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            test \
            -only-testing:SingleThreadTests \
            -resultBundlePath TestResults-mac.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-unit-test-results
          path: TestResults-mac.xcresult

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Install mise
        run: brew install mise

      - name: Cache mise tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-tools-${{ runner.os }}-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-${{ runner.os }}-

      - name: Install tools
        run: mise install

      - name: Put mise shims on PATH
        run: echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: SwiftFormat check
        timeout-minutes: 5
        run: swiftformat --lint SingleThread/ SingleThreadCore/ SingleThreadWatch/ SingleThreadWidget/ SingleThreadTests/ SingleThreadUITests/ SingleThreadWatchUITests/ SingleThreadWatchTests/

      - name: SwiftLint
        timeout-minutes: 5
        run: swiftlint lint --strict

      - name: Watch build
        timeout-minutes: 15
        run: |
          xcodebuild -scheme SingleThreadWatch \
            -destination "generic/platform=watchOS Simulator" \
            -configuration Debug \
            build \
            -showBuildTimingSummary

      - name: Periphery
        timeout-minutes: 10
        run: periphery scan --strict -- -destination "platform=iOS Simulator,name=iPhone 17"

  watch-ui-tests:
    runs-on: macos-26
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: '26.6'

      - name: Override development team
        run: echo "DEVELOPMENT_TEAM=" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/DerivedData
          key: watch-ui-derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.ref_name }}-${{ hashFiles('SingleThreadWatch/**', 'SingleThreadWatchUITests/**', 'SingleThreadWatchTests/**', 'SingleThreadCore/**', 'SingleThread.xcodeproj/project.pbxproj') }}
          restore-keys: |
            watch-ui-derived-data-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Create standalone watch simulator
        run: |
          # GitHub's macOS image ships a standalone watchOS Simulator AND watch
          # simulators paired with iPhones, so a name-only destination is
          # ambiguous and xcodebuild fails to resolve it. Create a fresh,
          # unpaired watch (deterministic name + id) to run UI tests against.
          RUNTIME=$(xcrun simctl list runtimes | grep -i watchos | \
            grep -oE 'com.apple.CoreSimulator.SimRuntime.watchOS-[0-9-]+' | sort -V | tail -1)
          UDID=$(xcrun simctl create "CI Watch S11" \
            "com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-11-46mm" "$RUNTIME")
          echo "WATCH_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot watch simulator
        run: |
          xcrun simctl boot "${{ env.WATCH_UDID }}" || true
          xcrun simctl bootstatus "${{ env.WATCH_UDID }}" -b

      - name: Build watch app + tests
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThreadWatch \
            -destination "platform=watchOS Simulator,id=${{ env.WATCH_UDID }}" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            -only-testing:SingleThreadWatchUITests \
            -only-testing:SingleThreadWatchTests \
            -showBuildTimingSummary

      - name: Watch UI tests
        timeout-minutes: 45
        run: |
          xcodebuild -scheme SingleThreadWatch \
            -destination "platform=watchOS Simulator,id=${{ env.WATCH_UDID }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -maximum-test-execution-time-allowance 900 \
            test-without-building \
            -only-testing:SingleThreadWatchUITests

      - name: Watch unit tests
        timeout-minutes: 20
        run: |
          xcodebuild -scheme SingleThreadWatch \
            -destination "platform=watchOS Simulator,id=${{ env.WATCH_UDID }}" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building \
            -only-testing:SingleThreadWatchTests
